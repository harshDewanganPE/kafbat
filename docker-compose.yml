services:
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"

      # Homebrew Kafka running on this Mac, via its DOCKER listener.
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:19092

      KAFKA_CLUSTERS_1_NAME: pharmeasy-oms
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: ${STAGING_BOOTSTRAP_SERVERS}
      KAFKA_CLUSTERS_1_READONLY: "true"
      KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: ${STAGING_SECURITY_PROTOCOL}
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_MECHANISM: ${STAGING_SASL_MECHANISM}
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_JAAS_CONFIG: ${STAGING_SASL_JAAS_CONFIG}

      KAFKA_CLUSTERS_2_NAME: neo-prod
      KAFKA_CLUSTERS_2_BOOTSTRAPSERVERS: ${PROD_BOOTSTRAP_SERVERS}
      KAFKA_CLUSTERS_2_READONLY: "true"
